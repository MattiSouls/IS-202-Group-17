name: is202-group17

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-resourcesdb}
      MARIADB_USER: ${MARIADB_USER:-resourcesapp}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Create .env before starting Compose}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Create .env before starting Compose}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=${MARIADB_DATABASE:-resourcesdb};User ID=${MARIADB_USER:-resourcesapp};Password=${MARIADB_PASSWORD:?Create .env before starting Compose};"
      Database__ApplyMigrationsOnStartup: "true"
      DataProtection__KeyDirectory: /app/keys
      SeedUsers__PublicUser__Email: ${SEED_PUBLIC_EMAIL:-}
      SeedUsers__PublicUser__Password: ${SEED_PUBLIC_PASSWORD:-}
      SeedUsers__Admin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedUsers__Admin__Password: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      - aspnet-keys:/app/keys
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
  aspnet-keys:
